<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Time Off Planner</title>
<style>
  :root{--ink:#EDE6DA;--mute:#938B7C;--line:#3B352D;--bg:#15120E;--card:#201C17;--field:#2A251F;--btn:#2E2822;--blue:#E0A458;--red:#E5584B;--violet:#B99CFF;--shadow:0 1px 0 rgba(255,255,255,.04),0 8px 24px rgba(0,0,0,.35)}
  *{box-sizing:border-box}
  html,body{min-height:100%;overflow-x:hidden}
  body{margin:0;font-family:Charter,"Iowan Old Style",Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:14px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
  header h1{font-size:20px;margin:0 10px 0 0;font-weight:700;letter-spacing:.2px;color:var(--blue)}
  header label{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:6px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  input,select,button{font:inherit;color:var(--ink)}
  input[type=date],input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--field);color:var(--ink);min-width:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  input[type=range]{accent-color:var(--blue)}
  input:focus,select:focus{outline:2px solid rgba(224,164,88,.45);border-color:transparent}
  button{border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--btn);cursor:pointer;font-weight:500;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  button:hover{border-color:#5A5147}
  button.primary{background:var(--blue);color:#1A1409;border-color:transparent;font-weight:700}
  button.danger{background:rgba(229,88,75,.14);color:#FF9C92;border-color:rgba(229,88,75,.3)}
  button.on{background:var(--ink);color:var(--bg)}
  .spacer{flex:1}

  main{display:flex;flex-direction:column;gap:14px;padding:14px;min-width:0}
  .left{display:flex;flex-direction:column;gap:14px;min-width:0}
  section{min-width:0}

  #leaveCard{display:flex;gap:14px;flex:0 0 auto;max-width:100%}
  .lc{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .lc.next{flex:1.2;display:flex;align-items:center;font-size:13px;color:var(--mute)}
  .lc.next b{color:var(--ink);font-family:Charter,Georgia,serif;font-size:15px}
  .lc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  .lc-h b{font-family:Charter,Georgia,serif;font-size:15px;font-weight:700}
  .lc-h label{color:var(--mute);font-size:11px;display:flex;align-items:center;gap:5px}
  .lc-h input{width:64px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font:inherit;font-size:13px;background:var(--field);color:var(--ink)}
  .lc-big{font-size:26px;font-weight:700;margin:8px 0 8px;letter-spacing:-.3px;font-family:Charter,Georgia,serif;color:var(--blue)}
  .lc-big.over{color:#FF8A7E}
  .lc-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .lc-bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
  .lc-sub{color:var(--mute);font-size:11px;margin-top:8px}

  #ganttCard{flex:0 0 auto;height:320px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:auto;position:relative}
  .head{position:sticky;top:0;z-index:4;background:var(--card)}
  .hrow{display:flex;height:26px;border-bottom:1px solid var(--line)}
  .hrow + .hrow{height:44px;border-bottom:1px solid var(--line)}
  .corner{position:sticky;left:0;z-index:5;width:230px;flex:0 0 230px;background:var(--card);display:flex;align-items:center;padding:0 14px;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .tl{position:relative;flex:0 0 auto;height:100%;background-image:repeating-linear-gradient(to right,#2C2822 0 1px,transparent 1px var(--px))}
  .mon{position:absolute;top:0;height:26px;line-height:26px;padding-left:8px;font-size:13px;font-style:italic;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden;color:var(--ink)}
  .wk{position:absolute;top:0;height:44px;padding:5px 6px;font-size:11px;color:var(--mute);border-left:1px solid #2C2822;white-space:nowrap;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .wk b{display:block;color:var(--ink);font-size:11px}
  .row{display:flex;height:50px;border-bottom:1px solid #2A251F}
  .row.sel{background:#29231C}
  .lab{position:sticky;left:0;z-index:3;width:230px;flex:0 0 230px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px;cursor:pointer;overflow:hidden}
  .row.sel .lab{background:#29231C}
  .lab i{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
  .lab b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;font-family:Charter,Georgia,serif}
  .lab small{display:block;color:var(--mute);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .bar{position:absolute;top:9px;height:32px;border-radius:8px;color:#1A1409;font-size:12px;font-weight:700;display:flex;align-items:center;padding:0 12px;box-sizing:border-box;cursor:grab;user-select:none;touch-action:none;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;z-index:2;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .bar:active{cursor:grabbing}
  .bar .txt{overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .row.sel .bar{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
  .h{position:absolute;top:0;bottom:0;width:12px;cursor:ew-resize}
  .h.l{left:0;border-radius:8px 0 0 8px;background:linear-gradient(to right,rgba(255,255,255,.4),transparent)}
  .h.r{right:0;border-radius:0 8px 8px 0;background:linear-gradient(to left,rgba(255,255,255,.4),transparent)}
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1;pointer-events:none}
  .focusline{position:absolute;top:0;bottom:0;width:2px;background:var(--violet);z-index:1;pointer-events:none}
  .empty{padding:40px;color:var(--mute);text-align:center;font-style:italic}

  #calCard{flex:0 0 auto;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px}
  .cal-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .cal-head > b{font-family:Charter,Georgia,serif;font-size:16px}
  .lg{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:11px}
  .lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .sw-hol{background:rgba(229,88,75,.35)}
  .sw-leave{background:rgba(224,164,88,.45)}
  .sw-wk{background:#2A251F}
  .cal-scroll{overflow:auto;max-height:300px;border:1px solid var(--line);border-radius:10px}
  .cal-grid{display:grid;grid-template-rows:24px repeat(31,18px);min-width:max-content}
  .cal-h{position:sticky;top:0;z-index:2;background:var(--card);font-size:12px;font-weight:700;font-style:italic;padding:4px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  .cal-c{position:relative;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:10px;background:var(--card);border-right:1px solid #2A251F;border-bottom:1px solid #26221C;white-space:nowrap;overflow:hidden;min-width:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .cal-c.wkend{background:#1A1713;color:#6F6759}
  .cal-c.hol{background:rgba(229,88,75,.28);color:#FFC2BA}
  .cal-c.leave{background:rgba(224,164,88,.3);color:#F7D9A8}
  .cal-c.empty{background:#18150F}
  .cal-c.is-today{box-shadow:inset 0 0 0 2px var(--ink)}
  .cn{font-weight:700;min-width:14px}
  .cw{color:var(--mute);font-size:9px}
  .cal-c.hol .cw{color:#FFC2BA}
  .cl.note{font-style:italic}
  .dot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
  .dot.fr,.sw-fr{background:#2F7BEA}
  .dot.ma,.sw-ma{background:#2E9E5B}
  .sw-fr,.sw-ma{width:12px;height:12px;border-radius:3px;display:inline-block}
  #notesCard{flex:0 0 auto;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .notes-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .notes-head b{font-family:Charter,Georgia,serif;font-size:18px}
  .notes-head span{color:var(--mute);font-size:12px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #notes{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:10px 12px;font:inherit;font-size:15px;line-height:1.5}
  #notes:focus{outline:2px solid rgba(224,164,88,.45);border-color:transparent}
  .dayedit{position:absolute;inset:0;width:100%;height:100%;border:0;outline:2px solid var(--blue);padding:0 6px;font:inherit;font-size:10px;background:var(--card);color:var(--ink);z-index:3}
  .cl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:600}

  .cal-c[data-ds]{cursor:pointer;user-select:none}
  .cal-c[data-ds]:hover{box-shadow:inset 0 0 0 1px var(--mute)}
  .cal-c.pick{background:var(--blue);color:#1A1409}
  .cal-c.unpick{background:rgba(229,88,75,.55);color:#fff;text-decoration:line-through}
  .pend{display:inline-flex;gap:8px;align-items:center;margin-left:auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .pend b{font-size:13px;color:var(--blue)}
  .calhint{color:var(--mute);font-size:11px;margin:0 0 8px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  #editor{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;flex:0 0 auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .ehead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .ehead .t{font-weight:700;font-size:18px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%;font-family:Charter,Georgia,serif}
  .fields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
  .fields.hidden{display:none}
  .fields label{display:flex;flex-direction:column;gap:3px;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .fields label input{color:var(--ink);text-transform:none;font-size:14px;font-weight:400;letter-spacing:0}
  .span2{grid-column:span 2}
  .lbl{color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  #swatches{display:flex;gap:8px;align-items:center;padding-top:6px}
  .sw{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
  .sw.on{box-shadow:0 0 0 2px var(--ink)}
  .hint{margin:10px 0 0;color:var(--mute);font-size:12px}

  #mapCard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;height:560px;max-width:100%}
  .mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .mapbar label{color:var(--mute);font-size:12px;display:flex;gap:6px;align-items:center}
  .mapwrap{position:relative;flex:1;min-height:440px}
  #map{position:absolute;inset:0;overflow:hidden;background:#2A251F;touch-action:none;user-select:none;cursor:grab}
  #map.picking{cursor:crosshair}
  #map canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #map .tiles{position:absolute;inset:0;overflow:hidden}
  #map .tiles img{position:absolute;width:256px;height:256px;pointer-events:none;-webkit-user-drag:none}
  #map .pins{position:absolute;inset:0;pointer-events:none}
  .pin{position:absolute;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto}
  .pin span{transform:rotate(45deg);color:#fff;font-size:13px;line-height:1}
  .pin.sel{box-shadow:0 0 0 3px rgba(237,230,218,.4),0 3px 8px rgba(0,0,0,.4)}
  .pin.dim{opacity:.3}
  .plab{position:absolute;transform:translateX(-50%);background:rgba(32,28,23,.94);color:var(--ink);font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;border-left:3px solid var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .plab.dim{opacity:.35}
  .mpop{position:absolute;pointer-events:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.5);padding:10px 12px;min-width:190px;font-size:13px;line-height:1.4;transform:translate(-50%,-100%);margin-top:-40px;cursor:default;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .mpop:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--card)}
  .mpop small{color:var(--mute)}
  .zoomctl{position:absolute;right:12px;bottom:28px;display:flex;flex-direction:column;gap:6px;z-index:5}
  .zoomctl button{width:34px;height:34px;padding:0;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.4);font-size:18px;line-height:1}
  .attr{position:absolute;left:8px;bottom:4px;font-size:10px;color:#ddd;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:4px;z-index:5;pointer-events:none}
  .mapmsg{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(237,230,218,.94);color:#1A1409;padding:8px 14px;border-radius:10px;font-size:13px;z-index:1000;max-width:90%;text-align:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .mapmsg[hidden]{display:none}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .toast.show{opacity:1}

  @media (max-width:900px){
    .fields{grid-template-columns:1fr 1fr}
    #leaveCard{flex-wrap:wrap}
    .lc{flex:1 1 45%} .lc.next{flex:1 1 100%}
    #mapCard{height:460px}
  }
</style>
</head>
<body>

<header>
  <h1>Time Off</h1>
  <label>From <input type="date" id="fromIn"></label>
  <label>To <input type="date" id="toIn"></label>
  <button id="btnAdd" class="primary">+ New time off</button>
  <span class="spacer"></span>
  <button id="btnExport">Export</button>
  <button id="btnImport">Import</button>
  <input type="file" id="fileIn" accept="application/json" hidden>
  <button id="btnReset" class="danger">Reset</button>
</header>

<main>
  <div class="left">
    <section id="leaveCard"></section>
    <section id="calCard"></section>

    <section id="editor">
      <div class="ehead">
        <span class="t" id="edTitle">No time off selected</span>
        <select id="tripSel" style="max-width:260px" aria-label="Choose a trip"></select>
        <button id="btnPick">Pick on map</button>
        <button id="btnFind">Find place</button>
        <button id="btnDel" class="danger">Delete</button>
      </div>
      <div class="fields hidden" id="fields">
        <label class="span2">Name<input type="text" id="f_name" placeholder="e.g. Vacation in Morocco"></label>
        <label class="span2">Place<input type="text" id="f_place" placeholder="e.g. Marrakech, Morocco"></label>
        <label>Start<input type="date" id="f_start"></label>
        <label>End<input type="date" id="f_end"></label>
        <label>Latitude<input type="number" step="any" id="f_lat"></label>
        <label>Longitude<input type="number" step="any" id="f_lng"></label>
        <label class="span2" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:13px;color:var(--ink)"><input type="checkbox" id="f_leave" style="width:16px;height:16px"> Counts as paid leave</label>
        <div class="span2"><span class="lbl">Colour</span><div id="swatches"></div></div>
      </div>
      <p class="hint" id="edHint">Choose a trip above to edit it, or add a new one.</p>
    </section>
  </div>

  <section id="mapCard">
    <div class="mapbar">
      <label>Show on <input type="date" id="showDate"></label>
      <select id="mapMode">
        <option value="all">All trips</option>
        <option value="date">Active on date</option>
      </select>
      <select id="style" title="Map style">
        <option value="minimal">Minimal light</option>
        <option value="colour">Colourful</option>
        <option value="dark">Dark</option>
        <option value="standard">Standard (OpenStreetMap)</option>
        <option value="satellite">Satellite (Google Earth style)</option>
        <option value="iphone">iPhone style (Apple-like)</option>
      </select>
      <button id="btnFit">Fit all</button>
      <button id="btnGlobe">Globe</button>
    </div>
    <div class="mapwrap"><div id="map"></div></div>
    <div class="mapmsg" id="mapMsg" hidden></div>
  </section>

  <section id="notesCard">
    <div class="notes-head"><b>Notes</b><span>Anything about your vacation days</span></div>
    <textarea id="notes" placeholder="Write your notes here: flights, plans, reminders…"></textarea>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const DAY = 864e5;
const KEY = 'timeoff-planner-v1';
const STYLE_KEY = 'timeoff-map-style';
const PAL = ['#007AFF','#34C759','#FF9500','#AF52DE','#FF2D55','#5AC8FA','#FFCC00'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const KNOWN = {
  'marrakech':[31.6295,-7.9811,'Marrakech, Morocco'],
  'casablanca':[33.5731,-7.5898,'Casablanca, Morocco'],
  'rabat':[34.0209,-6.8416,'Rabat, Morocco'],
  'fes':[34.0181,-5.0078,'Fès, Morocco'],
  'agadir':[30.4278,-9.5981,'Agadir, Morocco'],
  'tangier':[35.7595,-5.8340,'Tangier, Morocco'],
  'paris':[48.8566,2.3522,'Paris, France'],
  'amsterdam':[52.3676,4.9041,'Amsterdam, Netherlands'],
  'rijswijk':[52.0364,4.3247,'Rijswijk, Netherlands'],
  'istanbul':[41.0082,28.9784,'Istanbul, Türkiye'],
  'lisbon':[38.7223,-9.1393,'Lisbon, Portugal'],
  'barcelona':[41.3874,2.1686,'Barcelona, Spain'],
  'dubai':[25.2048,55.2708,'Dubai, UAE'],
  'new york':[40.7128,-74.006,'New York, USA'],
  'tokyo':[35.6762,139.6503,'Tokyo, Japan']
};
// Map images from Esri (ArcGIS basemaps) and OpenStreetMap. No API key, no scripts: only plain images.
const TILE_STYLES = {
  minimal:{ url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', maxZ:16, attr:'Tiles © Esri, HERE, Garmin', filter:'sepia(.18) saturate(.85) brightness(1.03) contrast(.96)' },
  colour: { url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', maxZ:16, attr:'Tiles © Esri, HERE, Garmin, USGS', filter:'saturate(.6) brightness(1.04) contrast(.94)' },
  dark:   { url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', maxZ:16, attr:'Tiles © Esri, HERE, Garmin', filter:'contrast(1.04)' },
  standard:{ url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', maxZ:18, attr:'© OpenStreetMap contributors', filter:'saturate(.55) contrast(.95) brightness(1.04)' },
  satellite:{ url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', maxZ:18,
    overlay:'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    attr:'Imagery © Esri, Maxar, Earthstar Geographics', filter:'none' },
  iphone:{ url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', maxZ:17,
    attr:'Tiles © Esri, HERE, Garmin, OpenStreetMap', filter:'saturate(.8) brightness(1.06) contrast(.96)' }
};

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const uid = () => Math.random().toString(36).slice(2,9);
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmt = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a,b) => Math.round((b-a)/DAY);
const mondayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const fmtShort = s => parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const fmtLong = s => parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t - y0)/DAY + 1)/7);
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}

function addMissingLeave(v){
  if (!v.to || v.to < LEAVE_END) v.to = LEAVE_END;
  if (!v.allowance) v.allowance = { ...ALLOWANCE_DEFAULT };
  if (!v.dayLabels) v.dayLabels = {};
  LEAVE_ITEMS.forEach(li => {
    if ((v.dropped || []).includes(li.id)) return;
    const ex = v.items.find(x => x.id === li.id);
    if (!ex) v.items.push({ ...li });
    else if (!ex.leave) ex.leave = li.leave;
  });
  return v;
}
// Working days a trip covers. Only trips marked as paid leave are counted.
function leaveDatesFor(it){
  if (!it.paidLeave && !it.leave) return [];
  if (Array.isArray(it.days)) return it.days.filter(ds => isWorkDay(parse(ds)));
  const [a, b] = it.leave || [it.start, it.end];
  const out = [], end = parse(b);
  for (let d = parse(a); d <= end; d = addDays(d, 1)) if (isWorkDay(d)) out.push(fmt(d));
  return out;
}
function renderLeave(){
  const el = $('leaveCard'); if (!el) return;
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = fmt(today);
  const allow = y => (S.allowance && S.allowance[y] != null) ? S.allowance[y] : ALLOWANCE_DEFAULT[y];
  let html = '';
  [2026, 2027].forEach(y => {
    const dates = new Set();
    S.items.forEach(it => leaveDatesFor(it).forEach(ds => { if (ds.startsWith(y + '-')) dates.add(ds); }));
    const planned = dates.size;
    const taken = [...dates].filter(ds => ds < todayStr).length;
    const a = allow(y), left = a - planned, over = left < 0;
    const pct = a ? Math.min(100, planned / a * 100) : 100;
    html += `<div class="lc">
      <div class="lc-h"><b>${y} paid leave</b>
        <label>Allowance <input type="number" min="0" value="${a}" data-year="${y}"></label></div>
      <div class="lc-big${over ? ' over' : ''}">${over ? Math.abs(left) + ' days over' : left + ' days left'}</div>
      <div class="lc-bar"><i style="width:${pct}%;${over ? 'background:#FF3B30' : ''}"></i></div>
      <div class="lc-sub">Planned ${planned} · Taken so far ${taken}. Weekends and public holidays are not counted.</div>
    </div>`;
  });
  const next = S.items.filter(it => it.start >= todayStr).sort((p, q) => p.start < q.start ? -1 : 1)[0];
  html += `<div class="lc next">${next
    ? `Next time off: <b>&nbsp;${esc(next.name)}</b>&nbsp;in ${diffDays(today, parse(next.start))} days`
    : 'No upcoming time off'}</div>`;
  el.innerHTML = html;
}

// Year calendar: one column per month, one row per day. Dutch holidays in red, your leave in blue.
function renderCalendar(){
  const el = $('calCard'); if (!el) return;
  const from = parse(S.from), to = parse(S.to);
  const fy = from.getFullYear(), fm = from.getMonth();
  const nM = (to.getFullYear() - fy) * 12 + (to.getMonth() - fm) + 1;
  const leaveOn = {};
  // Shade every day of each trip, weekends included. The countdown still skips weekends and holidays.
  S.items.forEach(it => {
    const label = it.name.replace(/\s*\(.*\)\s*$/, '');
    tripDays(it).forEach(ds => { if (!leaveOn[ds]) leaveOn[ds] = label; });
  });
  const todayStr = fmt(new Date());
  const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells = '';
  for (let i = 0; i < nM; i++){
    const y = fy + Math.floor((fm + i) / 12), m = (fm + i) % 12, col = i + 1;
    cells += `<div class="cal-h" style="grid-column:${col};grid-row:1">${MONTHS[m]} ${y}</div>`;
    const dim = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= 31; d++){
      const row = d + 1;
      if (d > dim){ cells += `<div class="cal-c empty" style="grid-column:${col};grid-row:${row}"></div>`; continue; }
      const date = new Date(y, m, d), ds = fmt(date), wd = date.getDay();
      const hol = HOLIDAYS[ds] || '', lv = leaveOn[ds] || '';
      const cls = ['cal-c'];
      if (wd === 0 || wd === 6) cls.push('wkend');
      if (hol) cls.push('hol'); else if (lv) cls.push('leave');
      if (ds === todayStr) cls.push('is-today');
      const note = (S.dayLabels || {})[ds] || '';
      const fr = FR_HOLIDAYS[ds] || '', ma = MA_HOLIDAYS[ds] || '';
      const dots = (fr ? `<i class="dot fr" title="France: ${esc(fr)}"></i>` : '') + (ma ? `<i class="dot ma" title="Morocco: ${esc(ma)}"></i>` : '');
      const label = note || hol || (fr ? 'FR · ' + fr : '') || (ma ? 'MA · ' + ma : '') || lv;
      cells += `<div class="${cls.join(' ')}" data-ds="${ds}" style="grid-column:${col};grid-row:${row}" title="${esc(date.toDateString() + (label ? ' · ' + label : ''))}">` +
        `<span class="cn">${d}</span><span class="cw">${WD[wd]}</span>${dots}<span class="cl${note ? ' note' : ''}">${esc(label)}</span></div>`;
    }
  }
  const pendHtml = pending.size
    ? `<span class="pend"><b>${pending.size} day${pending.size > 1 ? 's' : ''} selected</b><button class="primary" id="btnCommit">Create time off</button><button id="btnClearPend">Clear</button></span>`
    : '';
  el.innerHTML = `<div class="cal-head"><b>Calendar</b>
      <span class="lg"><i class="sw-hol"></i>Public holiday</span>
      <span class="lg"><i class="sw-leave"></i>Time off</span>
      <span class="lg"><i class="sw-wk"></i>Weekend</span><span class="lg"><i class="sw-fr"></i>France holiday</span><span class="lg"><i class="sw-ma"></i>Morocco holiday</span>${pendHtml}</div><div class="calhint">Hold Ctrl and click or drag days, then release Ctrl to create time off · Shift+click removes days · Click a day and press T (or double-click) to write a note on it</div>
    <div class="cal-scroll"><div class="cal-grid" style="grid-template-columns:repeat(${nM},118px)">${cells}</div></div>`;
}

function geom(it){
  const ws = mondayOf(parse(S.from)), dp = S.px/7;
  const l = diffDays(ws, parse(it.start)) * dp;
  const w = (diffDays(parse(it.start), parse(it.end)) + 1) * dp;
  return { l, w: Math.max(w, dp) };
}
function weeksN(){
  const ws = mondayOf(parse(S.from));
  return Math.max(1, Math.ceil((diffDays(ws, parse(S.to)) + 1) / 7));
}

/* ---------- Editor ---------- */
function fillEditor(){
  const it = cur();
  const f = $('fields');
  if (!it){
    f.classList.add('hidden');
    $('edTitle').textContent = 'No time off selected';
    $('edHint').textContent = 'Choose a trip above to edit it, or add a new one.';
    $('swatches').innerHTML = '';
    return;
  }
  f.classList.remove('hidden');
  $('edTitle').textContent = it.name || 'Untitled';
  $('f_name').value = it.name || '';
  $('f_place').value = it.place || '';
  $('f_start').value = it.start;
  $('f_end').value = it.end;
  $('f_lat').value = it.lat ?? '';
  $('f_lng').value = it.lng ?? '';
  $('f_leave').checked = !!it.paidLeave;
  $('swatches').innerHTML = PAL.map(c => `<button class="sw${c===it.color?' on':''}" style="background:${c}" data-c="${c}" aria-label="colour"></button>`).join('');
  updateHint(it);
}
function updateHint(it){
  const days = diffDays(parse(it.start), parse(it.end)) + 1;
  $('edHint').textContent = `${days} days · ${(days/7).toFixed(1)} weeks. Use Duplicate to copy this trip.`;
}

});
$('swatches').addEventListener('click', e => {
  const b = e.target.closest('.sw'); const it = cur();
  if (!b || !it) return;
  it.color = b.dataset.c; save(); renderGantt(); renderMap(); fillEditor();
});
const textFields = { f_name:'name', f_place:'place', f_start:'start', f_end:'end', f_lat:'lat', f_lng:'lng' };
Object.keys(textFields).forEach(id => {
  $(id).addEventListener('input', () => {
    const it = cur(); if (!it) return;
    let v = $(id).value;
    if (id === 'f_lat' || id === 'f_lng'){
      const n = parseFloat(v); v = isNaN(n) ? null : n;
    }
    if (id === 'f_start' || id === 'f_end'){
      if (!isDate(v)) return;
      const old = { days: it.days, start: it.start, end: it.end };
      delete it.days;
      it[textFields[id]] = v;
      if (parse(it.end) < parse(it.start)){
        if (id === 'f_start') it.end = it.start; else it.start = it.end;
      }
      const c = conflictsFor(rangeDays(it.start, it.end), it.id);
      if (c.length){
        it.start = old.start; it.end = old.end;
        if (old.days) it.days = old.days; else delete it.days;
        fillEditor(); warnConflict(c); return;
      }
      fillEditor();
    } else {
      it[textFields[id]] = v;
    }
    save(); renderGantt(); renderMap(); updateHint(it);
    $('edTitle').textContent = it.name || 'Untitled';
  });
});

async function findPlace(q){
  const k = q.toLowerCase().split(',')[0].trim();
  const hit = Object.keys(KNOWN).find(n => k.includes(n));
  if (hit) return { lat:KNOWN[hit][0], lng:KNOWN[hit][1], name:KNOWN[hit][2] };
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=en&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (j[0]) return { lat:+j[0].lat, lng:+j[0].lon, name:j[0].display_name.split(',').slice(0,2).join(',').trim() };
  } catch(e){}
  return null;
}

/* ---------- Globe (3D sphere, built in, no external scripts) ---------- */
const TEX_N = 2048;
const GLOBE = { on:false, canvas:null, ctx:null, data:{}, lat:20, lon:-30, zoom:1, drag:null, raf:0, hits:[] };

function ensureTexture(style){
  if (GLOBE.data[style]) return Promise.resolve(GLOBE.data[style]);
  const tpl = TILE_STYLES[style].url, z = 3, n = 8;
  const cv = document.createElement('canvas'); cv.width = cv.height = TEX_N;
  const cx = cv.getContext('2d', { willReadFrequently:true });
  const jobs = [];
  for (let ty = 0; ty < n; ty++) for (let tx = 0; tx < n; tx++){
    jobs.push(new Promise(res => {
      const im = new Image(); im.crossOrigin = 'anonymous';
      im.onload = () => { cx.drawImage(im, tx*256, ty*256, 256, 256); res(); };
      im.onerror = () => res();
      im.src = tpl.replace('{s}', 'abcd'[(tx+ty)%4]).replace('{z}', z).replace('{x}', tx).replace('{y}', ty);
    }));
  }
  return Promise.all(jobs).then(() => {
    const data = cx.getImageData(0, 0, TEX_N, TEX_N).data;
    GLOBE.data[style] = data;
    return data;
  });
}
function sizeGlobe(){
  const el = $('map');
  GLOBE.canvas.width = el.clientWidth || 600;
  GLOBE.canvas.height = el.clientHeight || 400;
}
function setupGlobe(){
  $('map').innerHTML = '<canvas id="globe"></canvas>';
  GLOBE.canvas = $('globe'); GLOBE.ctx = GLOBE.canvas.getContext('2d'); sizeGlobe();
  const c = GLOBE.canvas;
  c.addEventListener('pointerdown', e => {
    GLOBE.drag = { x:e.clientX, y:e.clientY, moved:false };
    c.setPointerCapture(e.pointerId);
  });
  c.addEventListener('pointermove', e => {
    const d = GLOBE.drag; if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.moved && Math.abs(dx) + Math.abs(dy) < 5) return;
    d.moved = true; d.x = e.clientX; d.y = e.clientY;
    const R = globeR();
    GLOBE.lon = ((GLOBE.lon - dx / R * 180 / Math.PI + 540) % 360) - 180;
    GLOBE.lat = Math.max(-80, Math.min(80, GLOBE.lat + dy / R * 180 / Math.PI));
    scheduleGlobe();
  });
  c.addEventListener('pointerup', e => {
    const d = GLOBE.drag; GLOBE.drag = null;
    if (!d || d.moved) return;
    const hit = GLOBE.hits.find(h => Math.hypot(h.x - e.offsetX, h.y - e.offsetY) < 18);
    if (hit){
      const it = S.items.find(x => x.id === hit.id);
      if (it){ GLOBE.lat = it.lat; GLOBE.lon = it.lng; }
      selectFromMap(hit.id); scheduleGlobe(); return;
    }
    if (pickMode){
      const p = globeInv(e.offsetX, e.offsetY);
      if (p) onMapClick(p.lat, p.lng);

    e.preventDefault();
    GLOBE.zoom = Math.max(0.5, Math.min(2.2, GLOBE.zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));

  }, { passive:false });
}
function globeR(){ const c = GLOBE.canvas; return Math.round(Math.min(c.width, c.height) * 0.42 * GLOBE.zoom); }
function scheduleGlobe(){
  if (GLOBE.raf) return;
  GLOBE.raf = requestAnimationFrame(() => { GLOBE.raf = 0; drawGlobe(); });
}
function globeInv(px, py){
  const c = GLOBE.canvas, R = globeR();
  const xx = (px - c.width/2) / R, yy = -(py - c.height/2) / R;
  const rho = Math.hypot(xx, yy);
  if (rho > 1) return null;
  if (rho < 1e-9) return { lat:GLOBE.lat, lng:GLOBE.lon };
  const cc = Math.asin(rho), p0 = GLOBE.lat*Math.PI/180, l0 = GLOBE.lon*Math.PI/180;
  const lat = Math.asin(Math.cos(cc)*Math.sin(p0) + yy*Math.sin(cc)*Math.cos(p0)/rho);
  const lon = l0 + Math.atan2(xx*Math.sin(cc), rho*Math.cos(p0)*Math.cos(cc) - yy*Math.sin(p0)*Math.sin(cc));

}
function drawGlobe(){
  if (!GLOBE.canvas || !GLOBE.data[mapStyle]) return;
  const c = GLOBE.canvas, g = GLOBE.ctx, W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const tex = GLOBE.data[mapStyle];
  const cx = W/2, cy = H/2, R = globeR(), d = 2*R + 1;

  const halo = g.createRadialGradient(cx, cy, R*0.98, cx, cy, R*1.1);
  halo.addColorStop(0, 'rgba(140,200,255,.55)');
  halo.addColorStop(1, 'rgba(140,200,255,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, R*1.1, 0, Math.PI*2); g.fill();

  const img = g.createImageData(d, d), out = img.data;
  const p0 = GLOBE.lat*Math.PI/180, l0 = GLOBE.lon*Math.PI/180;
  const sp = Math.sin(p0), cp = Math.cos(p0);
  for (let j = 0; j < d; j++){
    const yy = -(j - R)/R;
    for (let i = 0; i < d; i++){
      const xx = (i - R)/R, r2 = xx*xx + yy*yy;
      if (r2 > 1) continue;
      const rho = Math.sqrt(r2);
      let lat, lon;
      if (rho < 1e-9){ lat = p0; lon = l0; }
      else {
        const cc = Math.asin(rho), sc = Math.sin(cc), c2 = Math.cos(cc);
        lat = Math.asin(Math.max(-1, Math.min(1, c2*sp + yy*sc*cp/rho)));
        lon = l0 + Math.atan2(xx*sc, rho*cp*c2 - yy*sp*sc);
      }
      const latD = lat*180/Math.PI;
      const lonD = ((lon*180/Math.PI + 540) % 360) - 180;
      const la = Math.max(-85, Math.min(85, latD)) * Math.PI/180;
      const v = Math.floor((1 - Math.log(Math.tan(la) + 1/Math.cos(la))/Math.PI)/2 * TEX_N);
      const u = Math.floor((lonD + 180)/360 * TEX_N);
      const ti = (Math.min(TEX_N-1, Math.max(0, v))*TEX_N + Math.min(TEX_N-1, Math.max(0, u))) * 4;
      const shade = 0.5 + 0.5*Math.sqrt(1 - r2);
      const o = (j*d + i)*4;
      out[o] = tex[ti]*shade; out[o+1] = tex[ti+1]*shade; out[o+2] = tex[ti+2]*shade; out[o+3] = 255;
    }
  }
  g.putImageData(img, Math.round(cx - R), Math.round(cy - R));

  GLOBE.hits = [];
  g.font = '600 12px -apple-system, "Segoe UI", Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const mode = $('mapMode').value, dateStr = $('showDate').value;
  validPts().forEach(it => {
    const phi = it.lat*Math.PI/180, dl = it.lng*Math.PI/180 - l0;
    if (sp*Math.sin(phi) + cp*Math.cos(phi)*Math.cos(dl) <= 0) return;
    const x = cx + R*Math.cos(phi)*Math.sin(dl);
    const y = cy - R*(cp*Math.sin(phi) - sp*Math.cos(phi)*Math.cos(dl));
    GLOBE.hits.push({ id:it.id, x, y });
    const faded = !(mode === 'all' || isActive(it, dateStr));
    g.globalAlpha = faded ? 0.35 : 1;
    g.beginPath(); g.arc(x, y, it.id === selId ? 9 : 7, 0, Math.PI*2);
    g.fillStyle = it.color; g.fill(); g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke();
    const label = it.name || 'Untitled', tw = g.measureText(label).width + 14;
    g.fillStyle = 'rgba(255,255,255,.94)'; g.fillRect(x - tw/2, y + 10, tw, 20);
    g.fillStyle = '#1C1C1E'; g.fillText(label, x, y + 20);
    g.globalAlpha = 1;
  });
}

/* ---------- Flat map (built in, no external scripts) ---------- */
const TS = 256;
const MAP = { el:null, tiles:null, pins:null, z:3, cx:0, cy:0, openId:null, downPin:null, downX:0, downY:0, moved:false, dragging:false, lastX:0, lastY:0 };

function worldPx(lat, lng, z){
  const n = TS * Math.pow(2, z);
  const la = Math.max(-85, Math.min(85, lat)) * Math.PI / 180;
  return {
    x: (lng + 180) / 360 * n,
    y: (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n
  };
}
function pxToLatLng(x, y, z){
  const n = TS * Math.pow(2, z);
  const lng = x / n * 360 - 180;
  const m = Math.PI - 2 * Math.PI * y / n;
  const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(m) - Math.exp(-m)));
  return { lat, lng };
}
function mapSize(){ return { w: MAP.el.clientWidth || 600, h: MAP.el.clientHeight || 400 }; }

function mapInit(){
  const el = $('map');
  el.innerHTML = `<div class="tiles"></div><div class="pins"></div>
    <div class="zoomctl"><button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button></div>
    <div class="attr"></div>`;
  MAP.el = el; MAP.tiles = el.querySelector('.tiles'); MAP.pins = el.querySelector('.pins');
  const w0 = worldPx(30, 10, MAP.z); MAP.cx = w0.x; MAP.cy = w0.y;

  el.addEventListener('pointerdown', e => {
    if (e.target.closest('.zoomctl')) return;
    MAP.downPin = e.target.closest('.pin, .mpop');
    MAP.downPin = MAP.downPin && MAP.downPin.classList.contains('pin') ? MAP.downPin.dataset.id : null;
    MAP.downX = MAP.lastX = e.clientX; MAP.downY = MAP.lastY = e.clientY;
    MAP.moved = false; MAP.dragging = true;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', e => {
    if (!MAP.dragging) return;
    const dx = e.clientX - MAP.lastX, dy = e.clientY - MAP.lastY;
    if (!MAP.moved && Math.abs(e.clientX - MAP.downX) + Math.abs(e.clientY - MAP.downY) < 6) return;
    MAP.moved = true;
    MAP.lastX = e.clientX; MAP.lastY = e.clientY;
    MAP.cx -= dx; MAP.cy -= dy;
    mapRender();
  });
  el.addEventListener('pointerup', e => {
    if (!MAP.dragging) return;
    MAP.dragging = false;
    if (MAP.moved) return;

    if (pickMode){
      const r = el.getBoundingClientRect(); const { w, h } = mapSize();
      const ll = pxToLatLng(MAP.cx - w/2 + (e.clientX - r.left), MAP.cy - h/2 + (e.clientY - r.top), MAP.z);
      onMapClick(ll.lat, ll.lng);
    } else {
      MAP.openId = null; mapRender();

  });
  el.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1 : -1); }, { passive:false });
  el.querySelector('#zIn').onclick = e => { e.stopPropagation(); zoomBy(1); };
  el.querySelector('#zOut').onclick = e => { e.stopPropagation(); zoomBy(-1); };

}
function zoomBy(dz){
  const z = Math.max(1, Math.min(TILE_STYLES[mapStyle].maxZ, MAP.z + dz));
  if (z === MAP.z) return;
  const f = Math.pow(2, z - MAP.z);
  MAP.cx *= f; MAP.cy *= f; MAP.z = z;
  mapRender();
}
function setView(lat, lng, z){
  if (GLOBE.on){ GLOBE.lat = lat; GLOBE.lon = lng; scheduleGlobe(); return; }
  MAP.z = z;

  mapRender();
}
function mapRender(){
  if (!MAP.el || GLOBE.on) return;
  const { w, h } = mapSize(), n = Math.pow(2, MAP.z);
  const ox = MAP.cx - w/2, oy = MAP.cy - h/2;
  MAP.tiles.innerHTML = '';
  const x0 = Math.floor(ox / TS), x1 = Math.floor((ox + w) / TS);
  const y0 = Math.max(0, Math.floor(oy / TS)), y1 = Math.min(n - 1, Math.floor((oy + h) / TS));

  MAP.el.querySelector('.attr').textContent = TILE_STYLES[mapStyle].attr;
  MAP.tiles.style.filter = TILE_STYLES[mapStyle].filter || 'none';
  for (let ty = y0; ty <= y1; ty++){
    for (let tx = x0; tx <= x1; tx++){
      const wx = ((tx % n) + n) % n;
      const img = new Image();
      img.src = tpl.replace('{s}', 'abcd'[(wx + ty) % 4]).replace('{z}', MAP.z).replace('{x}', wx).replace('{y}', ty);
      img.alt = ''; img.draggable = false;
      img.style.left = (tx * TS - ox) + 'px';
      img.style.top = (ty * TS - oy) + 'px';
      MAP.tiles.appendChild(img);
      const ov = TILE_STYLES[mapStyle].overlay;
      if (ov){
        const o = new Image();
        o.src = ov.replace('{z}', MAP.z).replace('{x}', wx).replace('{y}', ty);
        o.alt = ''; o.draggable = false;
        o.style.left = img.style.left; o.style.top = img.style.top;

function renderPins(ox, oy){
  MAP.pins.innerHTML = '';

  validPts().forEach(it => {
    const p = worldPx(it.lat, it.lng, MAP.z);
    const x = p.x - ox, y = p.y - oy;
    const dim = !(mode === 'all' || isActive(it, dateStr));
    const sel = it.id === selId;
    const pin = document.createElement('div');
    pin.className = 'pin' + (sel ? ' sel' : '') + (dim ? ' dim' : '');

    pin.style.top = (y - 30) + 'px';
    pin.innerHTML = '<span>✈</span>';

    const lab = document.createElement('div');

    lab.style.left = x + 'px';
    lab.style.top = (y + 6) + 'px';
    lab.style.borderLeftColor = it.color;
    lab.textContent = it.name || 'Untitled';
    MAP.pins.appendChild(lab);
    if (MAP.openId === it.id){
      const pop = document.createElement('div');
      pop.className = 'mpop';
      pop.style.left = x + 'px';
      pop.style.top = (y - 30) + 'px';

    }
  });
}
function selectFromMap(id){

function focusMarker(id){

function fitAll(){
  const pts = validPts();
  if (GLOBE.on){
    if (pts.length){
      GLOBE.lat = pts.reduce((s, p) => s + p.lat, 0) / pts.length;
      GLOBE.lon = pts.reduce((s, p) => s + p.lng, 0) / pts.length;
    }
    GLOBE.zoom = 1; scheduleGlobe(); return;
  }
  if (!MAP.el) return;
  const { w, h } = mapSize();
  if (!pts.length){ setView(20, 10, 2); return; }
  for (let z = 7; z >= 1; z--){
    const xs = pts.map(p => worldPx(p.lat, p.lng, z).x), ys = pts.map(p => worldPx(p.lat, p.lng, z).y);
    const spanX = Math.max(...xs) - Math.min(...xs), spanY = Math.max(...ys) - Math.min(...ys);

      MAP.z = z;
      MAP.cx = (Math.max(...xs) + Math.min(...xs)) / 2;

function isActive(it, dateStr){

/* ---------- Calendar: click, drag, Ctrl (add days), Shift (remove days) ---------- */
let pending = new Set();
let calDrag = null;
let focusDay = null;
const isCtrl = e => e.ctrlKey || e.metaKey;
function rangeDays(a, b){
  const lo = a < b ? a : b, hi = a < b ? b : a, out = [];
  for (let d = parse(lo); fmt(d) <= hi; d = addDays(d, 1)) out.push(fmt(d));
  return out;
}
function tripDays(it){
  return Array.isArray(it.days) ? it.days : rangeDays(it.start, it.end);
}
function forget(id){
  if (LEAVE_ITEMS.some(li => li.id === id)) S.dropped = (S.dropped || []).concat(id);
}
function makeTrip(days){
  const sorted = [...new Set(days)].sort();
  const it = { id:uid(), name:'New time off', place:'', lat:null, lng:null,
    start:sorted[0], end:sorted[sorted.length-1], days:sorted, paidLeave:true,
    color:PAL[S.items.length % PAL.length] };

}
function openTrip(it){

}
function conflictsFor(days, exceptId){
  const set = new Set(days), out = [];
  S.items.forEach(it => {
    if (it.id === exceptId) return;

    if (hit.length) out.push({ name: it.name || 'Untitled', days: hit });
  });

}
function warnConflict(c){

}
function editDayLabel(ds){
  const cell = document.querySelector(`#calCard .cal-c[data-ds="${ds}"]`);
  if (!cell || cell.querySelector('input')) return;
  const inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'dayedit'; inp.maxLength = 40;
  inp.value = (S.dayLabels || {})[ds] || '';
  inp.placeholder = 'Text for this day';
  cell.appendChild(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = keep => {
    if (done) return; done = true;
    if (keep){
      const v = inp.value.trim();

      if (v) S.dayLabels[ds] = v; else delete S.dayLabels[ds];
      save();
    }
    renderCalendar();
  };
  inp.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter'){ e.preventDefault(); finish(true); }
    if (e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
}
$('calCard').addEventListener('dblclick', e => {

});
function commitPending(){

function removeDays(set){

    if (nd.length === days.length){ keep.push(it); return; }
    changed = true;
    if (!nd.length){ forget(it.id); if (selId === it.id) selId = null; return; }
    it.days = nd; it.start = nd[0]; it.end = nd[nd.length - 1];
    keep.push(it);
  });

}
function paintCalSel(){

// Top or bottom 4px of a day cell: grab it to extend the time off through the days you drag over.

let hoverCell = null;
$('calCard').addEventListener('pointermove', e => {

function tripOnDay(ds){ return S.items.find(it => tripDays(it).includes(ds)) || null; }
function calCellAt(x, y){
  const el = document.elementFromPoint(x, y);
  return el && el.closest ? el.closest('.cal-c[data-ds]') : null;
}
$('calCard').addEventListener('pointerdown', e => {
  if (e.target.tagName === 'INPUT') return;
  const c = e.target.closest('.cal-c[data-ds]');
  if (!c) return;
  e.preventDefault();
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) document.activeElement.blur();
  const onEdge = !e.shiftKey && !isCtrl(e) && tripOnDay(c.dataset.ds) && edgeZone(c, e);
  const mode = e.shiftKey ? 'remove' : (isCtrl(e) ? 'add' : (onEdge ? 'extend' : 'create'));
  calDrag = { a:c.dataset.ds, b:c.dataset.ds, moved:false, mode };
  paintCalSel();
});
window.addEventListener('pointermove', e => {
  if (!calDrag) return;
  const c = calCellAt(e.clientX, e.clientY);
  if (!c || c.dataset.ds === calDrag.b) return;
  calDrag.b = c.dataset.ds; calDrag.moved = true;
  paintCalSel();
});
window.addEventListener('pointerup', () => {
  if (!calDrag) return;
  const d = calDrag; calDrag = null;
  const days = rangeDays(d.a, d.b);
  if (d.mode === 'remove'){
    removeDays(new Set(days));
  } else if (d.mode === 'add'){
    if (!d.moved && pending.has(d.a)) days.forEach(x => pending.delete(x));
    else days.forEach(x => pending.add(x));
    renderCalendar();
  } else if (d.mode === 'extend'){
    const owner = tripOnDay(d.a);
    if (!owner) return;
    if (!d.moved){ select(owner.id); paintCalSel(); return; }
    const walk = rangeDays(d.a, d.b);
    if (d.b < d.a) walk.reverse();
    const add = [];
    let blockedBy = null;
    for (const ds of walk){
      const other = S.items.find(x => x.id !== owner.id && tripDays(x).includes(ds));
      if (other){ blockedBy = other; break; }
      add.push(ds);
    }
    const days = [...new Set([...tripDays(owner), ...add])].sort();
    owner.days = days; owner.start = days[0]; owner.end = days[days.length - 1];
    save(); renderAll();
    if (blockedBy) toast(`Stopped before “${blockedBy.name || 'Untitled'}”`);
  } else {
    // Plain click or drag never creates time off: it selects an existing trip, or clears the Ctrl selection.
    focusDay = d.a;
    const ex = tripOnDay(d.a);
    if (ex) select(ex.id);
    if (pending.size){ pending.clear(); renderCalendar(); }
  }
});
$('calCard').addEventListener('click', e => {
  if (e.target.id === 'btnCommit') commitPending();
  if (e.target.id === 'btnClearPend'){ pending.clear(); renderCalendar(); }
});
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if ((e.key === 't' || e.key === 'T' || e.key === 'F2') && !e.ctrlKey && !e.metaKey && !e.altKey){
    if (!focusDay){ toast('Click a day first, then press T'); return; }
    e.preventDefault();
    editDayLabel(focusDay);
    return;
  }
  if (e.key === 'Enter' && pending.size) commitPending();
  if (e.key === 'Escape' && pending.size){ pending.clear(); renderCalendar(); }
});
// Hold Ctrl (Cmd on Mac) and click or drag over days; releasing the key creates the time off.
document.addEventListener('keyup', e => {
  if ((e.key === 'Control' || e.key === 'Meta') && pending.size) commitPending();
});

$('tripSel').onchange = e => select(e.target.value || null);

$('notes').addEventListener('input', e => { S.notes = e.target.value; save(); });

/* ---------- boot ---------- */
function renderAll(){
  renderGantt(); renderMap(); fillEditor();
  if (document.activeElement !== $('notes')) $('notes').value = S.notes || '';
}
$('showDate').value = fmt(new Date());
$('leaveCard').addEventListener('change', e => {
  if (!e.target.matches('input[data-year]')) return;
  if (!S.allowance) S.allowance = { ...ALLOWANCE_DEFAULT };
  S.allowance[e.target.dataset.year] = Math.max(0, parseInt(e.target.value, 10) || 0);
  save(); renderLeave();
});
mapInit();
renderAll();
requestAnimationFrame(() => { fitAll(); });
</script>
</body>
